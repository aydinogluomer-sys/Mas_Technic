    <!-- LCP hero görseli için preload BURADA STATİK OLARAK YAZILAMAZ: Vite
         `src/assets/technical-landing/hero-manifold-v1.webp` dosyasını içerik
         hash'iyle yayınlıyor, dolayısıyla nihai URL derleme zamanında belli
         oluyor. `vite.config.ts` içindeki `mas-hero-preload` eklentisi doğru
         URL ile tek bir image preload bağlantısı enjekte eder.
         Buradaki eski satır `/src/assets/hero-cnc.jpg` adresini gösteriyordu:
         var olmayan bir dosya, SPA fallback'i üzerinden `text/html` dönüyor
         ve tarayıcı bir HTML belgesini yüksek öncelikli görsel olarak
         indiriyordu. -->


    <!-- UX01: the static app-shell wordmark and the entry sequence that ran on
         it were removed. The landing's LCP is the hero image, which
         `mas-hero-preload` (vite.config.ts) preloads with its hashed URL; the
         wordmark only ever matched the dev-only legacy landing. -->
    <!-- The removed shell also painted the graphite ground before the CSS
         bundle arrived; this keeps that first frame dark instead of white.
         Same ground the removed shell used (close to `--tl-void`), which cannot be read
         before the stylesheet loads. -->
    <style>html { background: #080d12; }</style>

    <!-- C1 — FONTS ARE SELF-HOSTED. The three families used to come from
         fonts.googleapis.com / fonts.gstatic.com (two requests, one of them
         delayed behind `document.fonts.ready`, plus a `<noscript>` copy). They
         are now WOFF2 files in `src/assets/fonts/`, declared in
         `src/styles/fonts.css` (generated by `scripts/fonts/self-host.mjs`) and
         bundled with the main stylesheet; `mas-font-preload` in vite.config.ts
         preloads the faces the first screen paints. No visitor request goes to
         Google for type any more, which the privacy texts now say. -->
  </head>

  <body>
    <div id="root"></div>
    <script>
      /* L01 — an /en address is English from the first paint: the static
         title and <html lang> follow the URL before any bundle runs.
         UX01 — the full-screen "Precision Born" entry sequence that used to
         live here (a 1.75–5.2 s timed overlay with a percentage counter) is
         gone: nothing waits before the page renders, no `data-intro-active`
         is set on <html> and no `mas_intro_seen` key is written. */
      (function () {
        if (/^\/en(\/|$)/.test(location.pathname)) {
          document.documentElement.lang = "en";
          document.title = "Mas Technic | High-Precision CNC Manufacturing & Machining";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
