    <!-- LCP hero görseli için preload BURADA STATİK OLARAK YAZILAMAZ: Vite
         `src/assets/technical-landing/hero-manifold-v1.webp` dosyasını içerik
         hash'iyle yayınlıyor, dolayısıyla nihai URL derleme zamanında belli
         oluyor. `vite.config.ts` içindeki `mas-hero-preload` eklentisi doğru
         URL ile tek bir image preload bağlantısı enjekte eder.
         Buradaki eski satır `/src/assets/hero-cnc.jpg` adresini gösteriyordu:
         var olmayan bir dosya, SPA fallback'i üzerinden `text/html` dönüyor
         ve tarayıcı bir HTML belgesini yüksek öncelikli görsel olarak
         indiriyordu. -->


    <!-- UX01: the static app-shell wordmark and the entry sequence that ran on
         it were removed. The landing's LCP is the hero image, which
         `mas-hero-preload` (vite.config.ts) preloads with its hashed URL; the
         wordmark only ever matched the dev-only legacy landing. -->
    <!-- The removed shell also painted the graphite ground before the CSS
         bundle arrived; this keeps that first frame dark instead of white.
         Same ground the removed shell used (close to `--tl-void`), which cannot be read
         before the stylesheet loads. -->
    <style>html { background: #080d12; }</style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PHASE 10-4 — SYMBOL SUBSET. Google's latin / latin-ext `unicode-range` blocks stop at
         U+02FF (+ a few punctuation ranges), so every arrow, comparison and GD&T symbol the site
         sets (→ ← ≤ ≥ ≈ ⊥ ⌖ ◎ ○ ▱ ↻ ★ ☆ ∪ ⌀ …) was painted by Times New Roman / Cambria Math /
         Segoe UI Symbol even where the webfont has the glyph — measured in
         reports/10/probes/glyph-coverage-before.md. A `text=` request returns each family's faces
         cut to exactly these code points WITH a matching `unicode-range`, so nothing downloads
         until a symbol is rendered and a family that lacks a glyph simply falls through. Declared
         BEFORE the main request so the main subsets keep priority for everything else.

         APPLIED AFTER THE MAIN FACES HAVE SETTLED. Every `rel` swap is a style recalc that
         rebuilds the font-face set and restarts the face loads still in flight; two swaps a few
         milliseconds apart were measured (Playwright trace, reports/10/typography.md §5)
         requesting the same WOFF2 three times, and a load cancelled mid-flight is what the
         visual suite's F4 retry guard reports as `Route is already handled`. So this sheet
         waits: main link flipped → one frame for its recalc → `document.fonts.ready` → flip.
         Symbols set in the interval paint in the fallback face and swap once, the same way
         `display=swap` treats every other glyph. If the main sheet never flips (it failed),
         this one flips on its own after 5 s — it cannot make things worse. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&text=%E2%86%92%E2%86%90%E2%86%91%E2%86%93%E2%86%BB%E2%89%A4%E2%89%A5%E2%89%88%E2%8A%A5%E2%88%A5%E2%8C%92%E2%8C%93%E2%9F%82%E2%88%85%E2%8C%80%E2%97%8E%E2%97%8B%E2%96%B1%E2%8C%96%E2%98%85%E2%98%86%E2%88%AA&display=swap"
      as="style"
      onload="this.onload=null;var l=this,n=0;(function go(){var m=document.querySelector('link[data-font-main]');if(m&&m.rel!=='stylesheet'&&n++<100){setTimeout(go,50);return}requestAnimationFrame(function(){(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){l.rel='stylesheet'})})})()"
    />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      data-font-main
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />

  <body>
    <div id="root"></div>
    <script>
      /* L01 — an /en address is English from the first paint: the static
         title and <html lang> follow the URL before any bundle runs.
         UX01 — the full-screen "Precision Born" entry sequence that used to
         live here (a 1.75–5.2 s timed overlay with a percentage counter) is
         gone: nothing waits before the page renders, no `data-intro-active`
         is set on <html> and no `mas_intro_seen` key is written. */
      (function () {
        if (/^\/en(\/|$)/.test(location.pathname)) {
          document.documentElement.lang = "en";
          document.title = "Mas Technic | High-Precision CNC Manufacturing & Machining";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
