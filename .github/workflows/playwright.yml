name: CI

# Eski hâli: tek is, `npm run test:e2e` ile 784 kombinasyon (16 paket x 8
# Chromium projesi), `workers: 2`, `retries: 2`, `timeout-minutes: 30` ve
# webServer icin 180 sn — oysa soguk `npm run build` bu projede 4 dk 05 sn
# olculdu (reports/baseline/build-test-baseline.md §1). Yani zorunlu kontrol
# butcesi icinde bitemiyordu (known-blockers.md B07).
#
# Yeni hâli: derleme bir kez yapilir ve `dist/` paylasilir. Her PR'da ve
# main'e her push'ta: Chromium kritik paketi, WebKit/Firefox duman paketi ve
# genis regresyon ailesi (8 Chromium goruntu penceresi, her pencere ayri bir
# matris isi — birinin kirmizisi digerlerini durdurmaz). Regresyon eskiden
# yalniz `workflow_dispatch` ile kosuyordu; #5'te main'i kiran degisiklik
# (silinen rota manifesti) tam bu paketteydi ve PR'da hic kosmadigi icin
# yakalanmadi.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      golden:
        description: "Linux altin goruntulerini uret (artifact olarak; commit etmez)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Typecheck & lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Dikkat: `tsc --noEmit` KOK yapilandirmayla hicbir dosyayi derlemez
      # (`tsconfig.json` -> `"files": []`). `npm run typecheck` proje
      # yapilandirmalarini acikca hedefler.
      - name: Typecheck (app + node + e2e projects)
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  build:
    name: Production build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Supabase degerleri publishable (anon key, RLS ile korunuyor) ama artik
      # kaynakta gomulu degil; uretim derlemesi bunlari ortamdan alir.
      # Repo secret'lari tanimli degilse `src/integrations/supabase/env.ts`
      # modul yuklenirken hata firlatir ve dist hic acilmaz (tum E2E isleri
      # bos sayfa gorur). Bu derleme yalnizca testler icindir ve backend
      # cagrilari testlerde taklit edilir; secret yoksa yer tutucu kullanilir.
      # `npm run build` prerenders every public route with headless Chromium
      # (scripts/prerender/prerender.mjs), so the build job needs a browser.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: vercel.json matches the route table
        run: node scripts/vercel/generate-config.mjs --check
      # VITE_SITE_ENGLISH=live: the test build publishes the English surface
      # so its code stays under test; production decides separately
      # (USER_INPUTS.md §B, release.md).
      - name: Build once (vite + prerender)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-anon-key' }}
          VITE_SITE_ENGLISH: live
        run: npm run build
      - name: Assert dev-only surfaces are absent from dist
        run: |
          if grep -rilE "legacy-landing|LandingFlow|TestHowWeWork|TechnicalPreview" dist/; then
            echo "::error::dist/ still references a dev-only surface"
            exit 1
          fi
          echo "dist/ is free of dev-only surfaces"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e-critical:
    name: E2E critical (Chromium)
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # `dist/` indirildigi icin webServer yalnizca `preview` calistirir;
      # derleme tekrar edilmez. Reduced-motion ve axe sozlesmeleri bu pakette:
      # e2e/landing/landing-reduced-motion.spec.ts ve landing-accessibility.spec.ts.
      - name: Run critical suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:critical
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-critical
          path: playwright-report
          retention-days: 14
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-critical
          path: test-results
          retention-days: 14

  e2e-smoke:
    name: E2E smoke (WebKit + Firefox)
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wk-ff-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright WebKit + Firefox
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit firefox
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit firefox
      - name: Run smoke suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 14

  e2e-interop:
    # F1 — the critical flows (menu, FAQ, materials, quality PDFs, RFQ start,
    # booking dialog, back/forward, reduced motion) on WebKit and Firefox.
    # Separate from the smoke job: smoke proves the page paints, this proves
    # the buyer's path works. Emulated engines are not real devices.
    name: E2E interop (WebKit + Firefox)
    needs: build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wk-ff-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright WebKit + Firefox
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit firefox
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit firefox
      - name: Run interop suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:interop
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-interop
          path: |
            playwright-report
            test-results
          retention-days: 14

  e2e-regression:
    # Zorunlu kapi adayi. Her goruntu penceresi ayri is: adlar
    # "E2E regression (<proje>)" — branch protection'da tek tek secilebilir.
    # `continue-on-error` YOK; bir test kirmiziysa is kirmizi doner.
    name: E2E regression (${{ matrix.project }})
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-320
          - mobile-375
          - mobile-390
          - tablet-768
          - landscape-844
          - desktop-1280
          - desktop-1440-short
          - desktop-1440
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run regression suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  visual-guard:
    # Linux altin goruntusu yoksa gorsel paket KOSMAZ ve GitHub bunu "skipped"
    # olarak gosterir. Eskiden guard ayni isin icindeydi; adimlar atlaniyor ama
    # is yesil donuyordu, yani hic kosmamis bir kontrol "basarili" gorunuyordu.
    name: Visual baseline guard
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.guard.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check linux baselines
        id: guard
        run: |
          missing=0
          for project in visual-375 visual-1280 visual-1440; do
            if [ ! -f "e2e/__golden__/linux/$project/landing-fullpage.png" ]; then
              echo "::warning title=VISUAL-BASELINE-GAP-LINUX::missing e2e/__golden__/linux/$project/landing-fullpage.png"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" = "1" ]; then
            {
              echo "### VISUAL-BASELINE-GAP-LINUX"
              echo ""
              echo "No \`linux\` golden baseline is committed, so **E2E visual golden diff is skipped** (not passed)."
              echo "Produce candidates with *Run workflow → golden = true*, review the artifact, then commit it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  visual:
    name: E2E visual golden diff
    needs: [build, visual-guard]
    if: needs.visual-guard.outputs.missing == '0' && !(github.event_name == 'workflow_dispatch' && inputs.golden)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run golden diff suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:visual
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          retention-days: 14

  visual-golden-update:
    # Elle: Run workflow → golden = true. Linux referanslarini CI'in kendi
    # Chromium'uyla uretir ve ARTIFACT olarak yukler. Commit ETMEZ — bir insan
    # goruntuleri inceleyip e2e/__golden__/linux/ altina ekler.
    name: Visual golden candidates (manual)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.golden
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate candidates
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:visual:update
      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-candidates
          path: e2e/__golden__/linux
          if-no-files-found: error
          retention-days: 14
