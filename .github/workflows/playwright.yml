name: CI

# Eski hâli: tek is, `npm run test:e2e` ile 784 kombinasyon (16 paket x 8
# Chromium projesi), `workers: 2`, `retries: 2`, `timeout-minutes: 30` ve
# webServer icin 180 sn — oysa soguk `npm run build` bu projede 4 dk 05 sn
# olculdu (reports/baseline/build-test-baseline.md §1). Yani zorunlu kontrol
# butcesi icinde bitemiyordu (known-blockers.md B07).
#
# Yeni hâli: derleme bir kez yapilir ve `dist/` paylasilir; bloke eden kapi
# 62 kombinasyonluk Chromium kritik paketi, yaninda 12 kombinasyonluk
# WebKit/Firefox duman paketi. Genis regresyon ailesi (536 kombinasyon) PR'i
# bloke etmez, elle/nightly tetiklenir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Typecheck & lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Dikkat: `tsc --noEmit` KOK yapilandirmayla hicbir dosyayi derlemez
      # (`tsconfig.json` -> `"files": []`). `npm run typecheck` proje
      # yapilandirmalarini acikca hedefler.
      - name: Typecheck (app + node + e2e projects)
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  build:
    name: Production build
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Supabase degerleri publishable (anon key, RLS ile korunuyor) ama artik
      # kaynakta gomulu degil; uretim derlemesi bunlari ortamdan alir.
      - name: Build once
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Assert dev-only surfaces are absent from dist
        run: |
          if grep -rilE "legacy-landing|LandingFlow|TestHowWeWork|TechnicalPreview" dist/; then
            echo "::error::dist/ still references a dev-only surface"
            exit 1
          fi
          echo "dist/ is free of dev-only surfaces"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e-critical:
    name: E2E critical (Chromium)
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # `dist/` indirildigi icin webServer yalnizca `preview` calistirir;
      # derleme tekrar edilmez. Reduced-motion ve axe sozlesmeleri bu pakette:
      # e2e/landing/landing-reduced-motion.spec.ts ve landing-accessibility.spec.ts.
      - name: Run critical suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:critical
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-critical
          path: playwright-report
          retention-days: 14
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-critical
          path: test-results
          retention-days: 14

  e2e-smoke:
    name: E2E smoke (WebKit + Firefox)
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-wk-ff-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright WebKit + Firefox
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit firefox
      - name: Install system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit firefox
      - name: Run smoke suite
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:smoke
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 14

  visual:
    name: E2E visual golden diff
    needs: build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # BILINEN BOSLUK — VISUAL-BASELINE-GAP-LINUX
      # Altin goruntuler yalniz `win32` icin uretilebildi (bu gelistirme
      # makinesinde dogrulanabilen tek platform). CI ubuntu kosuyor, yani
      # `e2e/__golden__/linux/` yok. CI'in eksik referansi KENDILIGINDEN
      # URETMESINE izin verilmez: bu sahte bir yesil olurdu. Guard eksikligi
      # adiyla raporlar ve gorsel paketi atlar; referans eklendigi anda
      # paket kendiliginden calismaya baslar.
      - name: Guard platform baselines
        id: guard
        run: |
          missing=0
          for project in visual-375 visual-1280 visual-1440; do
            if [ ! -f "e2e/__golden__/linux/$project/landing-fullpage.png" ]; then
              echo "::warning title=VISUAL-BASELINE-GAP-LINUX::missing e2e/__golden__/linux/$project/landing-fullpage.png"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$missing" = "1" ]; then
            {
              echo "### VISUAL-BASELINE-GAP-LINUX"
              echo ""
              echo "No \`linux\` golden baseline is committed, so the golden diff suite did **not** run on CI."
              echo "Committed baselines: \`e2e/__golden__/win32/\` (verified locally)."
              echo "CI is deliberately **not** allowed to auto-create baselines — that would be a false green."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Cache Playwright browsers
        if: steps.guard.outputs.missing == '0'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.guard.outputs.missing == '0' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run golden diff suite
        if: steps.guard.outputs.missing == '0'
        env:
          CI: "true"
          PLAYWRIGHT_PREVIEW_ONLY: "1"
        run: npm run test:e2e:visual
      - name: Upload report
        if: always() && steps.guard.outputs.missing == '0'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report
          retention-days: 14
