name: Vercel preview

# Builds the site the same way CI does (vite + prerender with Chromium) and
# uploads the finished output to Vercel as a PREVIEW deployment. Never
# production: no `--prod`, and the Vercel project is not linked to Git, so a
# push to main deploys nothing by itself (release.md §2, option 1).
#
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN                   — a Vercel token for the team below
#   VITE_SUPABASE_URL              — public project URL
#   VITE_SUPABASE_PUBLISHABLE_KEY  — public anon / publishable key
# Without them the job stops and says which one is missing; it never builds
# against placeholder backend values.
#
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET — the project's "Protection Bypass
# for Automation" secret (Vercel → Project → Settings → Deployment
# Protection). With it the job verifies the deployed preview: every file of
# the build by hash, 404 / 308 / cache behaviour and the build identity
# (verify-release.mjs), and on a manual run optionally the lab performance
# (perf-lab.mjs). Without it those checks are skipped with a notice.

on:
  workflow_dispatch:
    inputs:
      english:
        description: "Publish the English surface in this preview (VITE_SITE_ENGLISH=live)"
        type: boolean
        default: false
      perf:
        description: "Also run the lab performance measurement against the preview (~15 min)"
        type: boolean
        default: false
  pull_request:
    branches: [main]

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VERCEL_SCOPE: omer-aydinoglu
  VERCEL_PROJECT: mas-technic

jobs:
  preview:
    name: Vercel preview deploy
    # Fork PRs get no secrets; skip them instead of failing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 50
    runs-on: ubuntu-latest
    steps:
      - name: Required secrets are set
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          # A PR is not blocked by a deploy that was never configured; a
          # manual run that cannot deploy is an error.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Vercel preview skipped — missing repository secrets:$missing"
            exit 0
          fi
          echo "::error::Missing repository secrets:$missing"
          exit 1
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Cache Playwright browsers
        if: steps.secrets.outputs.ready == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.secrets.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps (cached browsers)
        if: steps.secrets.outputs.ready == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: vercel.json matches the route table
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/vercel/generate-config.mjs --check
      # Preview build: no origin and no VITE_SITE_INDEXING, so it is noindex
      # with robots `Disallow: /`. English stays off unless asked for
      # (USER_INPUTS.md §B).
      - name: Build (vite + prerender)
        if: steps.secrets.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_ENGLISH: ${{ inputs.english && 'live' || '' }}
        run: npm run build
      # The output is uploaded as a static site: the routing config travels
      # with it, minus the build settings (nothing is built on Vercel).
      - name: Stage the prebuilt site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/$VERCEL_PROJECT"
          cp -R dist/. "$RUNNER_TEMP/$VERCEL_PROJECT/"
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
            for (const key of ["installCommand", "buildCommand", "outputDirectory"]) delete config[key];
            fs.writeFileSync(process.argv[1], JSON.stringify(config, null, 2));
          ' "$RUNNER_TEMP/$VERCEL_PROJECT/vercel.json"
      # The deployment is bound to the existing project by name on every run,
      # so no run depends on a link file left by an earlier runner. The
      # project is never created here: on Vercel the first deployment of a
      # new project is always production, whatever the target says (that is
      # how mas-technic.vercel.app got its first deployment on 4 Oct 2026).
      # A missing project stops the job instead.
      - name: Deploy preview
        if: steps.secrets.outputs.ready == 'true'
        id: deploy
        working-directory: ${{ runner.temp }}/${{ env.VERCEL_PROJECT }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel() { npx --yes vercel@62 "$@" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"; }
          if ! vercel project inspect "$VERCEL_PROJECT" >/dev/null 2>&1; then
            echo "::error::Vercel project '$VERCEL_PROJECT' not found in '$VERCEL_SCOPE'. Create it in Vercel first; this workflow does not, because a new project's first deployment is always production."
            exit 1
          fi
          vercel link --yes --project "$VERCEL_PROJECT"
          # Explicit, so the CLI never picks a target on its own.
          url=$(vercel deploy --yes --target=preview)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Vercel preview"
            echo ""
            echo "$url"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` · English: ${{ inputs.english && 'live' || 'off' }} · noindex preview build."
          } >> "$GITHUB_STEP_SUMMARY"
      # Deployment protection answers 401/403 and Trusted IPs answer 404
      # instead of the site, so the checks run only with the bypass secret,
      # which the tools send to the preview host and nowhere else.
      - name: Verify the deployed preview against the build
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not set; the protected preview was not verified."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          node scripts/quality/verify-release.mjs --base "${{ steps.deploy.outputs.url }}" --dist dist \
            --out "$RUNNER_TEMP/evidence/release-check.json" > /dev/null && status=0 || status=$?
          node -e '
            const r = require(process.argv[1]);
            const fails = r.findings.filter((f) => f.level === "fail");
            const warns = r.findings.filter((f) => f.level === "warn");
            const lines = ["", "### Release check (verify-release.mjs)", "",
              `${r.filesChecked} files checked · ${fails.length} fail · ${warns.length} warn`, "",
              ...r.findings.slice(0, 20).map((f) => `- ${f.level}: ${f.message}`)];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            for (const f of fails.slice(0, 20)) console.log(`::error::${f.message}`);
          ' "$RUNNER_TEMP/evidence/release-check.json"
          exit $status
      - name: Lab performance against the preview
        if: steps.secrets.outputs.ready == 'true' && inputs.perf
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -o pipefail  # perf-lab's own exit status, not tee's
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET is not set; performance was not measured."
            exit 0
          fi
          routes="/,/hizmetler/cnc-frezeleme"
          if [ "${{ inputs.english }}" = "true" ]; then routes="$routes,/en,/en/hizmetler/cnc-frezeleme"; fi
          mkdir -p "$RUNNER_TEMP/evidence"
          node scripts/quality/perf-lab.mjs --base "${{ steps.deploy.outputs.url }}" --routes "$routes" --runs 5 \
            --out "$RUNNER_TEMP/evidence/perf-lab.json" --har-dir "$RUNNER_TEMP/evidence/har" \
            --scope "Vercel preview ${GITHUB_SHA::7} (HTTP/2, Vercel edge), GitHub-hosted runner Chromium, slow-4G + 4x CPU emulation, 5 cold runs. Lab only; INP not measured; lab TBT is not INP." \
            | tee "$RUNNER_TEMP/evidence/perf-lab.txt"
          { echo ""; echo "### Lab performance (perf-lab.mjs)"; echo ""; echo '```'; grep "@" "$RUNNER_TEMP/evidence/perf-lab.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Artifacts are immutable per run; a re-run gets its own name.
          name: preview-evidence-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 30
